# =====================================================================
# Career Hunter - example configuration
# Copy this file to config.yaml and adapt it. No secrets here:
# tokens and keys live in the secrets/ folder (see README).
# =====================================================================

# Extra source modules loaded dynamically (Python modules in src/), in
# addition to the official API. Shared interface: a fetch() function.
# Leave empty to use only the official API.
extra_sources: []

# Scoring keywords (out of 10)
keywords:
  strong:            # core target (big points)
    - "m&a"
    - "corporate finance"
    - "private equity"
    - "investment banking"
    - "transaction services"
    - "leveraged finance"
  medium:            # adjacent finance
    - "financial analyst"
    - "asset management"
  hard_exclude:      # always dropped, even with a strong keyword
    - "lawyer"
    - "legal"
    - "notary"
  exclude:           # dropped if in the title and no strong keyword is present
    - "sales"
    - "retail"
    - "accountant"
    - "communication"

# Target employers: score bonus when the offer comes from them
target_employers:
  bonus: 3.5
  names:
    - "goldman sachs"
    - "morgan stanley"
    - "rothschild"
    - "lazard"
    - "bnp paribas"
    - "ardian"
    - "eurazeo"

# Profiles = separate tabs and bots. The profile id is also the CLI argument
# (e.g. `python3 scan.py alternance`); "alternance" is the French work-study
# contract and is kept as a domain term.
profiles:
  alternance:
    tab: "Work-study"
    type: "work-study"
    contracts: ["apprenticeship", "professionalization"]
    locations:
      - name: "Paris / Ile-de-France"
        latitude: 48.8566
        longitude: 2.3522
        radius_km: 30
    min_score: 6.0
    intake:                 # keep only a specific intake
      year: 2027
      months: [8, 9, 10, 11]
      strict: true

# Target degree level (European scale: 5=Bac+2, 6=Bac+3, 7=Master)
degree:
  target_eu: 7
  bonus_if_target: 2.0
  penalty_if_low: 3.0

# Google Sheet (the id sits in the sheet URL, between /d/ and /edit)
google_sheet:
  spreadsheet_id: "YOUR_GOOGLE_SHEET_ID"
  credentials_file: "secrets/google_service_account.json"
  archive_tab: "Archive"

behavior:
  no_reply_days: 21
  max_offers_per_session: 0
